        preview_path: ar/contact/
        fields:
          - label: Translation Key
            name: translationKey
            widget: hidden
            default: contact
          - label: Language Code
            name: lang
            widget: hidden
            default: ar
          - label: Content
            name: body
            widget: markdown
      - label: Contact Page (Persian)
        name: contact_fa
        file: src/content/spec/contact.fa.md
        preview_path: fa/contact/
        fields:
          - label: Translation Key
            name: translationKey
            widget: hidden
            default: contact
          - label: Language Code
            name: lang
            widget: hidden
            default: fa
          - label: Content
            name: body
            widget: markdown
      - label: Medical Evidence
        name: medical_evidence
        file: src/content/spec/medical-evidence.md
        preview_path: en/medical-evidence/
        fields:
          - { label: Translation Key, name: translationKey, widget: hidden, default: medical-evidence }
          - { label: Language Code, name: lang, widget: hidden, default: en }
          - { label: Content, name: body, widget: markdown, required: false }
      - label: Medical Evidence (Arabic)
        name: medical_evidence_ar
        file: src/content/spec/medical-evidence.ar.md
        preview_path: ar/medical-evidence/
        fields:
          - { label: Translation Key, name: translationKey, widget: hidden, default: medical-evidence }
          - { label: Language Code, name: lang, widget: hidden, default: ar }
          - { label: Content, name: body, widget: markdown, required: false }
      - label: Medical Evidence (Persian)
