        file: src/content/spec/about.fa.md
        preview_path: fa/about/
        fields:
          - label: Translation Key
            name: translationKey
            widget: hidden
            default: about
          - label: Language Code
            name: lang
            widget: hidden
            default: fa
          - label: Content
            name: body
