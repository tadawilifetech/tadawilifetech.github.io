  - name: pages
    label: Pages
    label_singular: Page
    description: Manage static pages
    files:
      - label: About Page
        name: about
        file: src/content/spec/about.md
        preview_path: en/about/
        fields:
          - label: Translation Key
            name: translationKey
            widget: hidden
            default: about
          - label: Language Code
            name: lang
            widget: hidden
            default: en
          - label: Content
            name: body
            widget: markdown
      - label: About Page (Arabic)
        name: about_ar
        file: src/content/spec/about.ar.md
        preview_path: ar/about/
        fields:
          - label: Translation Key
            name: translationKey
            widget: hidden
            default: about
          - label: Language Code
            name: lang
            widget: hidden
            default: ar
          - label: Content
            name: body
            widget: markdown
      - label: About Page (Persian)
