  - name: products_en
    label: "Products (English)"
    label_singular: "Product (EN)"
    description: English products
    folder: src/content/products
    path: "{{slug}}/index"
    create: true
    delete: true
    extension: md
    format: frontmatter
    media_folder: /public/uploads/products
    public_folder: /uploads/products
    filter:
      field: lang
      value: en
    summary: "{{title}}"
    sortable_fields:
      - published
      - updated
      - title
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
      - label: Published
        field: draft
        pattern: false
    fields:
      - label: Title
        name: title
        widget: string
      - label: Translation Key
        name: translationKey
        widget: string
        required: true
        hint: Shared identifier across all language versions.
      - label: Published At
        name: published
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - label: Updated At
        name: updated
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - label: Description
        name: description
        widget: text
        required: false
      - label: Cover Image
        name: image
        widget: image
        required: false
      - label: Price
        name: price
        widget: string
        required: false
      - label: Product Group
        name: group
        widget: select
        options: [{ label: "Sleep Apnea Products", value: "sleep" }, { label: "Orthopedic Braces", value: "orthopedic" }]
        default: sleep
      - label: Orthopedic Sub-category
        name: subcategory
        widget: select
        required: false
        options: [{ label: "Back & Spine", value: "back-spine" }, { label: "Knee", value: "knee" }, { label: "Foot & Ankle", value: "foot-ankle" }, { label: "Hand & Wrist", value: "hand-wrist" }]
      - label: Sort Order
        name: order
        widget: number
        required: false
        default: 50
      - label: Gallery Images
        name: gallery
        widget: list
        required: false
        field: { label: Image, name: image, widget: image }
      - label: Video on main image click (file)
        name: imageVideo
        widget: file
        required: false
      - label: Videos (shown before the description)
        name: videos
        widget: list
        required: false
        fields:
          - { label: Title, name: title, widget: string, required: false }
          - { label: YouTube link or ID, name: youtube, widget: string, required: false }
          - { label: Video file, name: src, widget: file, required: false }
          - { label: Poster image, name: poster, widget: image, required: false }
          - { label: Stop at second (cut ending), name: end, widget: number, value_type: float, required: false }
      - label: Downloads
        name: downloads
        widget: list
        required: false
        hint: Files with the same group are shown together in one drop-down list.
        fields:
          - { label: Group, name: group, widget: string, required: false }
          - { label: Label, name: label, widget: string }
          - { label: File, name: file, widget: file }
      - label: Sizes
        name: sizes
        widget: list
        required: false
        fields:
          - { label: Size, name: size, widget: string }
          - { label: Range, name: range, widget: string }
      - label: Size measurement label
        name: sizeLabel
        widget: string
        required: false
      - label: FAQ
        name: faq
        widget: list
        required: false
        hint: Shown under the product description.
        fields:
          - { label: Question, name: q, widget: string }
          - { label: Answer, name: a, widget: text }
      - label: Tags
        name: tags
        widget: list
        required: false
      - label: Category
        name: category
        widget: string
        required: false
      - label: Draft
        name: draft
        widget: boolean
        default: true
        required: false
      - label: Language Code
        name: lang
        widget: hidden
        default: en
      - label: Content
